
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Room - StudyBloom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout">

        <aside class="sidebar">
            <h2>StudyBloom 🌸</h2>

            <nav>
                <a href="index.html">🏠 Dashboard</a>
                <a href="tasks.html">📝 My Tasks</a>
                <a href="progress.html">📊 Progress</a>
                <a href="focus.html" class="active">⏱️ Focus Room</a>
                <a href="resources.html">📚 Study Resources</a>
                <a href="profile.html">⚙️ Profile & Settings</a>
            </nav>

            <div class="sidebar-footer">
                <div class="footer-flower">🌷</div>
                <h3>Keep Growing!</h3>
                <p>Little efforts make big dreams come true. 💗</p>
            </div>
        </aside>

        <main class="main-content">

            <div class="focus-header">
                <h1>Focus Room ⏱️</h1>
                <p>Stay focused and make every minute count!</p>
            </div>

            <div class="simple-focus-card">

                <h2>Time to Focus! 🌸</h2>

                <div id="focus-timer">25:00</div>

                <div class="focus-buttons">
                    <button id="focus-start">Start</button>
                    <button id="focus-pause">Pause</button>
                    <button id="focus-reset">Reset</button>
                </div>

                <p id="focus-message">
                    Believe in yourself. You can do it! 💗
                </p>

            </div>

        </main>
    </div>

    <script src="script.js"></script>

</body>
</html>
